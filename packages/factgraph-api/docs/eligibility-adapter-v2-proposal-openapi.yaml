          items:
            $ref: "#/components/schemas/AssetRow"
      required:
        - id
      description: A household member. The fields shown are the common/derived ones;
        the full set of member fields is in the catalog
        (https://gary-community-ventures.github.io/rules-visualizer/engine-inputs.html).
        Unknown fields are ignored with a warning; absent fields are never
        guessed.
    CaregiverRelationship:
      type: object
      properties:
        caregiverId:
          type: string
          description: A member's id.
        dependentId:
          type: string
          description: A member's id.
      description: A caregiver→dependent link between two members (fields per catalog).
    HouseholdRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: {}
          description: Opaque; echoed back, never inspected.
        asOf:
          type: string
          format: date
          description: Evaluation date; defaults to now.
        household:
