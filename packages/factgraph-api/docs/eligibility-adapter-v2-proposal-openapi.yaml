paths:
  /v2/eligibility/evaluate/determination:
    post:
      summary: Eligibility determination (engine-shaped, no-guess).
      description: "One household payload plus a list of programs, returning a
        determination per program — household-scoped for SNAP, one per member
        for Medicaid. Nothing applicant-material is defaulted: anything
        needed-but-absent yields status `pending` and `missingInputs` listing
        the exact fields to fill, in this same request vocabulary. Field
        definitions and enum vocabularies:
        https://gary-community-ventures.github.io/rules-visualizer/engine-input\
        s.html."
      tags:
        - Eligibility v2
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeterminationRequest"
            examples:
              one household, both programs:
                value:
                  metadata:
                    caseId: abc-123
                  programs:
                    - snap
                    - medicaid
                  members:
                    - id: head
                      dateOfBirth: 1990-03-15
                      citizenshipImmigrationStatus: citizen
                      isHeadOfHousehold: true
                      income:
                        - type: wages_and_salaries
                          amount: 1200
                          frequency: monthly
      responses:
        "200":
          description: The unified determinations[] — one entry per requested program (per
            member for Medicaid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeterminationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
