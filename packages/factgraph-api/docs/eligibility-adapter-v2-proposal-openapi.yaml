        field:
          type: string
        location:
          type: string
          example: members[]
        type:
          type: string
          example: Boolean
        label:
          type: string
          description: The rule author's display name.
        options:
          type: array
          items:
            type: string
          description: Allowed values when the field is an enum.
      required:
        - requestPath
        - field
        - location
        - type
        - label
      description: An input that would unlock or refine this determination, in the
        request vocabulary.
    ExplanationStep:
      type: object
      properties:
        factor:
          type: string
        outcome: {}
      required:
        - factor
      description: One factor in a path-free "why".
    Determination:
      type: object
      properties:
        program:
          type: string
        scope:
          type: string
          enum:
            - household
            - member
          description: household (SNAP) or member (Medicaid, one per member).
        memberId:
          type: string
          description: Set when scope is member — the caller-assigned member id.
        status:
          type: string
          enum:
            - approved
            - denied
            - ineligible
            - pending
            - not_supported
        path:
          type: string
          enum:
            - auto
            - manual
          description: auto = decided by the rules; manual reserved for
            caseworker-verified determinations.
        benefitAmount:
          type: number
          description: Monthly benefit when approved (SNAP allotment).
        proratedFirstMonthAmount:
          type: number
        isExpedited:
          type: boolean
          description: "SNAP: expedited processing also applies."
        medicaidCategory:
          type: string
        chpEligible:
          type: boolean
        denialReasonCode:
          type: string
          description: snake_case; present on denied/ineligible.
        explanation:
          type: array
          items:
            $ref: "#/components/schemas/ExplanationStep"
          description: Path-free "why" for denials.
        missingInputs:
          type: array
          items:
            $ref: "#/components/schemas/MissingInput"
          description: "Present when pending: exactly which fields to fill, across all
            members."
        missingInputsByMember:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/MissingInput"
          description: "Present when pending and members were provided: the member-level
            subset of missingInputs keyed by member id. Shared inputs (income
            rows, expenses) appear only in the top-level missingInputs."
        notes:
          type: array
          items:
            type: string
          description: Assumptions/translation notes.
      required:
        - program
        - scope
        - status
      description: One program decision. One shape for household- and member-scoped
        programs (no oneOf).
    DeterminationResponse:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: {}
          description: Echoed from the request when present.
        asOf:
          type: string
          format: date
        determinations:
          type: array
          items:
            $ref: "#/components/schemas/Determination"
      required:
        - asOf
        - determinations
      description: Program determination response.
    ExpeditedScreeningResponse:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: {}
          description: Echoed from the request when present.
        asOf:
          type: string
          format: date
        isExpedited:
          type:
            - boolean
            - "null"
          description: true = qualifies for expedited processing; false = does not; null =
            inputs insufficient to screen.
        missingInputs:
          type: array
          items:
            $ref: "#/components/schemas/MissingInput"
          description: Present when isExpedited is null — the inputs needed to complete
            the screen.
        notes:
          type: array
          items:
            type: string
          description: Translation warnings, if any.
      required:
        - asOf
        - isExpedited
      description: Expedited screening result. isExpedited is null when inputs are
        insufficient to resolve the screen.
