paths:
  /v2/eligibility/snap/determination:
    post:
      summary: SNAP eligibility determination (no-guess).
      description: "One household payload; returns a single household-scoped
        determination. Nothing applicant-material is defaulted: anything
        needed-but-absent yields status `pending` and `missingInputs` listing
        the exact fields to fill, in this same request vocabulary. Expedited
        screening is included in the response (`isExpedited`). Field definitions
        and enum vocabularies:
        https://gary-community-ventures.github.io/rules-visualizer/engine-input\
        s.html."
      tags:
        - Eligibility v2
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdRequest"
            examples:
              single member household:
                value:
                  metadata:
                    caseId: abc-123
                  members:
                    - &a1
                      id: head
                      dateOfBirth: 1990-03-15
                      citizenshipImmigrationStatus: citizen
                      isHeadOfHousehold: true
                      income:
                        - type: wages_and_salaries
                          amount: 1200
                          frequency: monthly
      responses:
        "200":
          description: A single household-scoped determination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeterminationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/eligibility/snap/expedited-screening:
    post:
      summary: SNAP expedited processing screen (7 CFR §273.2(i)).
      description: "Screens whether the household qualifies for expedited processing
        (benefits within 7 days). Faster than the full determination — only the
        inputs that affect the expedited screen are needed. No-guess:
        `isExpedited` is null when the screen cannot resolve, and
        `missingInputs` names exactly what to provide."
      tags:
        - Eligibility v2
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdRequest"
            examples:
              destitute household:
                value:
                  metadata:
                    caseId: abc-123
                  members:
                    - id: head
                      dateOfBirth: 1990-03-15
                      citizenshipImmigrationStatus: citizen
                      isHeadOfHousehold: true
                      income:
                        - type: wages_and_salaries
                          amount: 0
                          frequency: monthly
      responses:
        "200":
          description: Expedited screening result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpeditedScreeningResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/eligibility/medicaid/determination:
    post:
      summary: Medicaid eligibility determination (no-guess, per member).
      description: "One household payload; returns one member-scoped determination per
        household member. Nothing applicant-material is defaulted: anything
        needed-but-absent yields status `pending` and `missingInputs` attributed
        to that specific member. Field definitions and enum vocabularies:
        https://gary-community-ventures.github.io/rules-visualizer/engine-input\
        s.html."
      tags:
        - Eligibility v2
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdRequest"
            examples:
              two-member household:
                value:
                  metadata:
                    caseId: abc-123
                  members:
                    - *a1
                    - id: spouse
                      dateOfBirth: 1992-07-20
                      citizenshipImmigrationStatus: citizen
      responses:
        "200":
          description: One member-scoped determination per household member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeterminationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
