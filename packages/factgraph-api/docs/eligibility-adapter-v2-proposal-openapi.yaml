openapi: 3.1.0
info:
  title: Eligibility Adapter API — v2 draft proposal
  version: 2.0.0-draft.1
  description: >-
    **Status: draft proposal for review — not an implemented surface.** The
    conformant v1 contract lives at `/v1/eligibility` and is unaffected.


    A proposed revision of the eligibility-adapter contract, addressing the gaps
    documented in `docs/contract-gap-analysis.md` and
    `docs/request-field-proposal.md`:


    1. **No-guess policy** — applicant-material facts and verification findings
    are never defaulted; what is missing comes back as `pending` +
    `missingInformation`.

    2. **The request can carry a real determination** — domain-shaped member,
    household, and application-context fields for everything the rules consume.

    3. **Medicaid cardinality fixed** — household in, per-member decisions out
    (or one member via `subjectMemberId`).

    4. **The response can express the outcome** — `benefitAmount`,
    `missingInformation`, `explanation` as first-class fields; `status` adds
    `not_supported`; `path` adds `ex_parte`.

    5. **Ex parte fully specified** — including proposed serviceResult payload
    shapes where the upstream schemas are currently stubs.


    Like v1, this contract is path-free: no rules-engine internals anywhere.
