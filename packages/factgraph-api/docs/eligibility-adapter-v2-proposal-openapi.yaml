          type: array
          items:
            $ref: "#/components/schemas/MissingInformation"
      required:
        - metadata
        - expedited
      description: Expedited screening result.
    FdshFtiResult:
      type: object
      properties:
        taxYear:
          type: integer
        filingStatus:
          type: string
        householdSize:
          type: integer
          description: Tax-unit size (MAGI household ≈ tax unit).
        earnedIncomeMonthly:
          type: number
        unearnedIncomeMonthly:
          type: number
      description: PROPOSED shape — the upstream serviceResult schema for fdsh_fti is
        currently an empty stub. Offered as a starting point for the
        data-exchange contract discussion.
    FdshSsaResult:
      type: object
      properties:
        ssiRecipient:
          type: boolean
        ssdiRecipient:
          type: boolean
        monthlyBenefitAmount:
          type: number
      description: PROPOSED shape — upstream schema is currently an empty stub.
    ElectronicCheckResult:
      type: object
      properties:
        serviceType:
          type: string
          enum:
            - fdsh_ssa
            - fdsh_vlp
            - fdsh_fti
            - fdsh_medicare
            - fdsh_vci
            - ssa_ievs
            - irs_ievs
            - swica
            - uib
            - save
            - enrollment_check
            - incarceration_check
        result:
          type: string
          enum:
            - conclusive
            - inconclusive
            - partial
            - error
        receivedAt:
          type: string
          format: date-time
        serviceResult:
          type: object
          additionalProperties: {}
          description: Service-specific payload. Polymorphic on serviceType — see
            FdshFtiResult / FdshSsaResult for the proposed shapes this adapter
            would consume.
      required:
        - serviceType
        - result
      description: Outcome of one data-exchange service call.
    MedicaidExParteRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: {}
          description: Opaque correlation context, echoed back unchanged; never inspected.
        program:
          type: string
          enum:
            - medicaid
        household:
          allOf:
            - $ref: "#/components/schemas/Household"
            - description: "REQUIRED here (a v2 change): MAGI eligibility needs household size
                + income even for a single applicant."
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberContext"
          minItems: 1
        subjectMemberId:
          type: string
          description: The applicant being evaluated ex parte.
        electronicChecks:
          type: array
          items:
            $ref: "#/components/schemas/ElectronicCheckResult"
          minItems: 1
      required:
        - metadata
        - program
        - household
        - members
        - subjectMemberId
        - electronicChecks
      description: "Ex parte evaluation (42 CFR §435.916): same MAGI determination,
        different evidentiary pathway. Semantics: every check relevant to a fact
        the determination depends on must be `conclusive`; otherwise the
        response is `pending` (the applicant cannot be asked for documentation
        on this pathway) and the case falls to the regular process."
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      required:
        - type
        - title
        - status
        - detail
      description: RFC 9457 Problem Details error.
  parameters: {}
paths:
  /v2/eligibility/evaluate/determination:
    post:
      summary: Final eligibility determination (no-guess).
      description: "Household-shaped for every program. SNAP returns a household
        ProgramDecision; per-member programs (medicaid) return one decision per
        member, or one member via subjectMemberId. Nothing applicant-material is
        defaulted: anything needed-but-absent yields status pending +
        missingInformation. **Draft proposal — not yet implemented.** The
        conformant v1 endpoint remains available under /v1/eligibility."
      tags:
        - Eligibility v2 (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeterminationRequest"
      responses:
        "200":
          description: ProgramDecision (household programs) or MemberDeterminationResponse
            (per-member programs).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ProgramDecision"
                  - $ref: "#/components/schemas/MemberDeterminationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "501":
          description: Draft proposal — not yet implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/eligibility/evaluate/expedited-screening:
    post:
      summary: Expedited SNAP screening (7 CFR §273.2(i)).
      description: Member/resource context first-class; missingInformation on the
        response when the screen cannot be decided. **Draft proposal — not yet
        implemented.** The conformant v1 endpoint remains available under
        /v1/eligibility.
      tags:
        - Eligibility v2 (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpeditedScreeningRequest"
      responses:
        "200":
          description: Screening result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpeditedScreeningResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "501":
          description: Draft proposal — not yet implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/eligibility/evaluate/medicaid-ex-parte:
    post:
      summary: Medicaid ex parte evaluation.
      description: "Same MAGI determination via the electronic-evidence pathway:
        household context required, every relevant check must be conclusive or
        the response is pending, and path is ex_parte (added to the DecisionPath
        enum — the published contract's example already uses it). **Draft
        proposal — not yet implemented.** The conformant v1 endpoint remains
        available under /v1/eligibility."
      tags:
        - Eligibility v2 (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicaidExParteRequest"
      responses:
        "200":
          description: Per-member decision for the subject applicant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDeterminationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "501":
          description: Draft proposal — not yet implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
webhooks: {}
