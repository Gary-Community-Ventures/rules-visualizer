        status:
          type: integer
        detail:
          type: string
      required:
        - type
        - title
        - status
      description: RFC 9457 Problem Details.
    IncomeRow:
      type: object
      properties:
        id:
          type: string
          description: Caller handle for response correlation.
        type:
          type: string
          description: snake_case income source (e.g. wages_and_salaries, ssi). See catalog.
        amount:
          type: number
        frequency:
          type: string
          description: snake_case e.g. monthly, weekly, annual.
      description: One income source for the member it nests under.
    ExpenseRow:
      type: object
      properties:
        id:
          type: string
      description: One expense for the member it nests under (fields per catalog).
    JobRow:
      type: object
      properties:
        id:
          type: string
      description: One job for the member it nests under (fields per catalog).
    AssetRow:
      type: object
      properties:
        id:
          type: string
      description: One asset for the member it nests under (fields per catalog).
    Member:
      type: object
      properties:
        id:
          type: string
          description: Caller-assigned id; echoed as memberId on member-scoped
            determinations and used by reference fields (spouseId, etc.).
        dateOfBirth:
          type: string
          format: date
          description: The engine derives age from this.
        citizenshipImmigrationStatus:
          type: string
          description: snake_case enum; see catalog.
        income:
          type: array
          items:
            $ref: "#/components/schemas/IncomeRow"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseRow"
        jobs:
