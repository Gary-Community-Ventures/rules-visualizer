[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-visualizer-rac"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "rac @ git+https://github.com/TheAxiomFoundation/rac.git",
    "aiohttp>=3.9",
    "watchdog>=4.0",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
]

[tool.setuptools.packages.find]
include = ["rules_visualizer_rac*"]

[project.scripts]
rules-visualizer-rac = "rules_visualizer_rac.cli:main"
